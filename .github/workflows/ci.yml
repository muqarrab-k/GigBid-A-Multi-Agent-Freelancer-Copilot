name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,data]"
      - name: GigSim unchanged since gigsim-v1
        run: |
          git fetch --tags --force
          git diff --exit-code --stat gigsim-v1 HEAD -- gigsim ':(exclude)gigsim/policies' ':(exclude)gigsim/data'
      - run: ruff check .
      - run: pytest -q
