# keeps the free render service awake; it sleeps after 15 idle minutes
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping /health
        env:
          URL: ${{ vars.GIGBID_URL || 'https://gigbid-3g0a.onrender.com' }}
        run: |
          if [ -z "$URL" ]; then echo "set the GIGBID_URL repository variable"; exit 0; fi
          # cold start can take a minute
          curl -fsS --retry 5 --retry-delay 15 --max-time 90 "$URL/health"
