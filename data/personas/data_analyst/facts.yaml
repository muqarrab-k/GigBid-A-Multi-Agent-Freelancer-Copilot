      - {path: channel_weights.py, purpose: "small Python script comparing the three attribution models"}
  - name: churn-cohorts
    project: p05
    files:
      - {path: cohorts.sql, purpose: "Postgres query for monthly retention by signup cohort and plan"}
      - {path: cohort_plot.py, purpose: "pandas pivot and retention heatmap"}
  - name: pantry-dbt
    project: p06
    files:
      - {path: models/marts/fct_orders.sql, purpose: "dbt model joining orders, refunds and subscriptions"}
      - {path: models/marts/schema.yml, purpose: "dbt tests and column descriptions for the orders mart"}
  - name: crm-dedupe
    project: p11
    files:
      - {path: normalize.py, purpose: "clean names, emails and phone numbers before matching"}
      - {path: dedupe.py, purpose: "block on email domain and fuzzy match names with rapidfuzz"}
  - name: ab-readouts
    project: p07
    files:
      - {path: power.py, purpose: "sample size and minimum detectable effect helper"}
      - {path: readout.py, purpose: "compute conversion lift with confidence intervals for an experiment"}
