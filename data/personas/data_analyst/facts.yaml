repos:
  - name: kpi-semantic-model
    project: p01
    files:
      - {path: measures.dax, purpose: "DAX measures for sales, margin, year-over-year and rolling 12 months"}
      - {path: model.sql, purpose: "SQL views that build the fact and dimension tables"}
  - name: ga4-attribution
    project: p02
    files:
