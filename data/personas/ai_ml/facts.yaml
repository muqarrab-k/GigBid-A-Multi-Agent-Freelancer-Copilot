repos:
  - name: ticket-router
    project: p01
    files:
      - {path: app/model.py, purpose: "scikit-learn TF-IDF plus linear SVM pipeline with a predict function"}
      - {path: app/tasks.py, purpose: "Celery task that retrains the model from new labelled tickets and swaps it in"}
      - {path: app/api.py, purpose: "FastAPI route that returns the queue and confidence for a ticket"}
  - name: invoice-extract
    project: p04
    files:
      - {path: extract/layout.py, purpose: "LayoutLMv3 token classification over OCR words and boxes"}
      - {path: extract/postprocess.py, purpose: "normalise dates and money amounts and check totals add up"}
  - name: clause-search
    project: p05
    files:
      - {path: ingest.py, purpose: "split contracts into clause chunks with page numbers and embed them into pgvector"}
      - {path: query.py, purpose: "retrieve top clauses and ask the model to answer only from them with citations"}
  - name: shelf-forecast
    project: p03
    files:
      - {path: features.py, purpose: "lag, rolling mean and holiday features per store and SKU"}
      - {path: train.py, purpose: "LightGBM training with a time-based split and WAPE metric"}
      - {path: dags/forecast_dag.py, purpose: "weekly Airflow DAG that trains, predicts and writes to BigQuery"}
  - name: defect-yolo
    project: p07
    files:
      - {path: train.py, purpose: "fine-tune YOLOv8 on tile images with crack and chip labels"}
      - {path: export_onnx.py, purpose: "export the model to ONNX with int8 quantisation and a quick accuracy check"}
  - name: resume-match
    project: p11
    files:
      - {path: embed_worker.py, purpose: "Celery worker that embeds changed resumes and upserts them into Qdrant"}
      - {path: search.py, purpose: "query Qdrant with a job description and apply simple filters"}
  - name: llm-evals
    project: p18
    files:
      - {path: judge.py, purpose: "rubric-based grader that asks a model for a score and a short reason"}
      - {path: test_regressions.py, purpose: "pytest file that fails when the average rubric score drops"}
