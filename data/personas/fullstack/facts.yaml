repos:
  - name: booking-saas
    project: p01
    files:
      - {path: prisma/schema.prisma, purpose: "models for Studio, ClassSession, Booking and Membership with a studioId on each"}
      - {path: src/lib/stripe.ts, purpose: "create a checkout session for a membership and handle the webhook"}
      - {path: src/pages/api/bookings.ts, purpose: "API route that books a class if there is space, scoped to the studio"}
  - name: live-fleet
    project: p02
    files:
      - {path: server/socket.ts, purpose: "Socket.IO server that subscribes to Redis GPS channel and emits truck updates per region"}
      - {path: client/useFleet.ts, purpose: "React hook that keeps a map of truck positions from socket events"}
  - name: report-worker
    project: p07
    files:
      - {path: worker.ts, purpose: "BullMQ worker that renders a statement and uploads it to S3 with retries"}
      - {path: render.ts, purpose: "Puppeteer helper that turns an HTML template into a PDF buffer"}
  - name: seatlock
    project: p11
    files:
      - {path: src/seats.ts, purpose: "hold and release a seat with Redis SET NX and an 8 minute expiry"}
      - {path: src/routes/checkout.ts, purpose: "Express route that confirms held seats after Stripe payment succeeds"}
  - name: img-pipeline
    project: p14
    files:
      - {path: handler.ts, purpose: "Lambda handler for S3 upload events"}
      - {path: resize.ts, purpose: "Sharp resize and watermark into three web sizes"}
  - name: pantry-billing
    project: p18
    files:
      - {path: src/billing/billing.service.ts, purpose: "NestJS service that maps old plans to Stripe prices and creates subscriptions"}
      - {path: src/jobs/dunning.processor.ts, purpose: "BullMQ processor that retries failed invoices on a schedule and emails the customer"}
  - name: e2e-kit
    project: p13
    files:
      - {path: tests/quote.spec.ts, purpose: "Playwright test for the broker quote flow"}
      - {path: playwright.config.ts, purpose: "config with retries, traces on failure and a CI project"}
