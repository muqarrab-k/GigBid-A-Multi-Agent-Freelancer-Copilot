# rag.variant in agent/config.yaml names one preset below
presets:
  v0: ""
  filter: "filter"
  v1: "decompose"
  v2: "hybrid"
  v3: "rerank"
  v8: "corrective"
  v1_filter: "filter+decompose"
  v2_filter: "filter+hybrid"
  v3_filter: "filter+rerank"
  v8_filter: "filter+corrective"
  v12_filter: "filter+decompose+hybrid"
  v123_filter: "filter+decompose+hybrid+rerank"
  v1238_filter: "filter+decompose+hybrid+rerank+corrective"
filter:
  types: [case_study, readme, review, code, cv]
rrf_k: 60
hybrid:
  # chunks per ranker before fusion
  pool: 60
rerank:
  # falls back to rag.reranker.model when empty
  model: ""
  fallback: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: 30
  max_length: 512
corrective:
  # sigmoid reranker score an item must reach
  pass_score: 0.3
  min_passing: 1
decompose:
  # hits per sub-query before fusion
  depth: 20
