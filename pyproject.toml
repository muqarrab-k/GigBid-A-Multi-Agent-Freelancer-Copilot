[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016 Assignment II)"
authors = [{ name = "Muqarrab" }]
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.22",
  "langgraph-checkpoint-postgres==3.2.1",
  "langchain-core==1.8.0",
  "langchain-openai==1.8.0",
  # adapters need mcp<2
  "mcp==1.30.0",
  "langchain-mcp-adapters==0.3.2",
  "fastapi==0.162.7",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "types-PyYAML==6.0.12.20261113",
]

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "rag*", "mcp_servers*", "evals*", "worker*"]

[tool.setuptools.package-data]
agent = ["config.yaml", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["gigsim", "apps/web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
