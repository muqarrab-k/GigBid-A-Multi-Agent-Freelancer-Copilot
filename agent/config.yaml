# runtime config

models:
  active_profile: open
  request_timeout_s: 60
  max_retries: 2

  # keys from env
  providers:
    ollama:
      api_key_env: null
      base_url_env: OLLAMA_BASE_URL
    groq:
      api_key_env: GROQ_API_KEY
    openrouter:
      api_key_env: OPENROUTER_API_KEY
    together:
      api_key_env: TOGETHER_API_KEY
    # synth generator only
    openai:
      api_key_env: OPENAI_API_KEY

  # shared open models
  embeddings:
    provider: ollama
    model: nomic-embed-text
    base_url: http://localhost:11434/v1
  reranker:
    provider: huggingface
    model: BAAI/bge-reranker-v2-m3

  # synthetic corpus renderer, never an agent
  active_generator: default
  generators:
    default:
      provider: openai
      model: gpt-5.4-mini-2026-03-17
      base_url: https://api.openai.com/v1
      temperature: 0.8
      max_tokens: 2000
      reasoning_effort: none
      # openai pricing page, 2026-11-14
      usd_per_mtok_in: 0.75
      usd_per_mtok_out: 4.50
    groq:
      provider: groq
      model: openai/gpt-oss-20b
      base_url: https://api.groq.com/openai/v1
      temperature: 0.8
      max_tokens: 2000
      reasoning_effort: low
      # check groq pricing
      usd_per_mtok_in: 0.075
      usd_per_mtok_out: 0.30
    groq_large:
      provider: groq
      model: openai/gpt-oss-120b
      base_url: https://api.groq.com/openai/v1
      temperature: 0.8
      max_tokens: 2000
      reasoning_effort: low
      usd_per_mtok_in: 0.15
      usd_per_mtok_out: 0.60

  profiles:
    open:
      scout: &open_small
        provider: ollama
        model: qwen3:4b
        base_url: http://localhost:11434/v1
        temperature: 0.0
        fallback:
          provider: groq
          model: openai/gpt-oss-20b
          base_url: https://api.groq.com/openai/v1
          temperature: 0.0
      analyst: *open_small
      risk_assessor: *open_small
      fit_matcher: *open_small
      pricing: *open_small
      verifier: *open_small
      compliance: *open_small
      writer: &open_strong
        provider: groq
        model: openai/gpt-oss-120b
        base_url: https://api.groq.com/openai/v1
        temperature: 0.4
      critic:
        <<: *open_strong
        temperature: 0.0
      client_liaison:
        <<: *open_strong
        temperature: 0.3

    paid:
      scout: *open_small
      analyst: *open_small
      risk_assessor: *open_small
      fit_matcher: *open_small
      pricing: *open_small
      verifier: *open_small
      compliance: *open_small
      writer: &paid_strong
        provider: openrouter
        model: openai/gpt-5-mini
        base_url: https://openrouter.ai/api/v1
        temperature: 0.4
      critic:
        <<: *paid_strong
        temperature: 0.0
      client_liaison:
        <<: *paid_strong
        temperature: 0.3

marketplace:
  mode: gigsim
  gigsim_base_url_env: GIGSIM_BASE_URL
  gigsim_base_url_default: http://localhost:8081
  upwork_mcp_url: https://mcp.upwork.com/mcp
  timeout_s: 15
  max_retries: 3
  backoff_s: 0.5
  backoff_max_s: 8
  # below gigsim's 30 burst, 0.5/s
  rate_limits:
    gigsim:
      requests_per_minute: 20
      burst: 10
      poll_interval_minutes: 30
    upwork:
      requests_per_minute: 10
      burst: 3
      poll_interval_minutes: 180

# our MCP servers
mcp:
  audit_dir: data/audit
  workspace_dir: data/workspace
  # stdio runs as this user
  default_user: noor
  issuer_url: http://localhost:8100
  ports: {marketplace: 8101, workspace: 8102}
  limits:
    search_limit_max: 50
    cover_letter_max_chars: 6000
    screening_answer_max_chars: 2000
    max_screening_answers: 10
    message_max_chars: 5000
    bid_max_usd: 100000
    idempotency_key_max_chars: 200
    free_slots_max_days: 14
    slot_min_minutes: 15
    slot_max_minutes: 240
    email_subject_max_chars: 200
    email_body_max_chars: 5000
  workspace:
    seed: 4016
    work_start_hour: 9
    work_end_hour: 17
    busy_blocks_per_day: 2
  # tokens: env wins, defaults are local dev only
  users:
    - user: noor
      tenant: ai_ml
      timezone: Asia/Karachi
      token_env: MCP_TOKEN_AI_ML
      token_default: dev-mcp-ai_ml
      gigsim_token_env: GIGSIM_TOKEN_AI_ML
      gigsim_token_default: dev-ai_ml-token
    - user: tobias
      tenant: fullstack
      timezone: Europe/Lisbon
      token_env: MCP_TOKEN_FULLSTACK
      token_default: dev-mcp-fullstack
      gigsim_token_env: GIGSIM_TOKEN_FULLSTACK
      gigsim_token_default: dev-fullstack-token
    - user: mina
      tenant: data_analyst
      timezone: America/Bogota
      token_env: MCP_TOKEN_DATA_ANALYST
      token_default: dev-mcp-data_analyst
      gigsim_token_env: GIGSIM_TOKEN_DATA_ANALYST
      gigsim_token_default: dev-data_analyst-token

budgets:
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 12000
  # declared targets
  targets:
    p95_latency_s_per_job: 20
    p95_latency_s_per_proposal: 60
    cost_usd_per_job: 0.002
    cost_usd_per_proposal: 0.01

thresholds:
  minimum_fit_score: 0.60
  watch_fit_score: 0.45
  maximum_risk_score: 0.70

bidding_rules:
  currency: USD
  weekly_connects_budget: 80
  max_connects_per_job: 16
  connects_unit_cost_usd: 0.15
  min_hourly_rate: 25
  min_fixed_price: 100
  platform_fee_pct: 10
  max_proposals_per_day: 10
  # fitted on 2023 jobs
  connects_rule:
    hourly_default: 12
    unknown_default: 8
    fixed_tiers:
      - {max_budget: 10, connects: 2}
      - {max_budget: 40, connects: 4}
      - {max_budget: 500, connects: 8}
      - {max_budget: 2000, connects: 12}
      - {max_budget: null, connects: 16}
  # new platform rules
  extra: {}

paths:
  policy_pack: data/policy_pack
  prompts_dir: agent/prompts
  personas_dir: data/personas
  processed_dir: data/processed
  raw_dir: data/raw/kaggle
  seed_dir: gigsim/seed

data:
  seed: 4016
  split_sizes:
    history: 1500
    stream: 400
    dev_pool: 600
  off_topic_share: 0.15
  stream_dup_cap: 3
  min_description_words: 20
  pricing_min_count: 30
  # outside caps -> null
  max_fixed_budget: 100000
  max_hourly_rate: 500
  contract_date_min: 2000-01-01
  contract_date_max: 2024-12-31

synth:
  proposals_per_persona: 150
  reviews_per_persona: 25
  label_noise: 0.15
  clients: 400
  scammer_share: 0.06
  scam_share: 0.08
  injection_share: 0.06
  holdout_size: 40
  dev_jobs_per_persona: 200
  relevant_evidence_k: 5
  # bid rule thresholds
  bid_min_skill_hits: 2
  bid_min_coverage: 0.3
