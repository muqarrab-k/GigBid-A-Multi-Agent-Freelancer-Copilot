# runtime config

models:
  active_profile: open
  request_timeout_s: 60
  max_retries: 2

  # keys from env
  providers:
    ollama:
      api_key_env: null
      base_url_env: OLLAMA_BASE_URL
    groq:
      api_key_env: GROQ_API_KEY
    openrouter:
      api_key_env: OPENROUTER_API_KEY
    together:
      api_key_env: TOGETHER_API_KEY
    # synth generator only
    openai:
      api_key_env: OPENAI_API_KEY

  # synthetic corpus renderer, never an agent
  active_generator: default
  generators:
    default:
      provider: openai
      model: gpt-5.4-mini-2026-03-17
      base_url: https://api.openai.com/v1
      temperature: 0.8
      max_tokens: 2000
      reasoning_effort: none
      # openai pricing page, 2026-11-14
      usd_per_mtok_in: 0.75
      usd_per_mtok_out: 4.50
    groq:
      provider: groq
      model: openai/gpt-oss-20b
      base_url: https://api.groq.com/openai/v1
      temperature: 0.8
      max_tokens: 2000
      reasoning_effort: low
      # check groq pricing
      usd_per_mtok_in: 0.075
      usd_per_mtok_out: 0.30
    groq_large:
      provider: groq
      model: openai/gpt-oss-120b
      base_url: https://api.groq.com/openai/v1
      temperature: 0.8
      max_tokens: 2000
      reasoning_effort: low
      usd_per_mtok_in: 0.15
      usd_per_mtok_out: 0.60

  profiles:
    open:
      scout: &open_small
        provider: ollama
        model: qwen3:4b
        base_url: http://localhost:11434/v1
        temperature: 0.0
        # qwen3 thinking off for json nodes
        reasoning_effort: none
        fallback:
          provider: groq
          model: openai/gpt-oss-20b
          base_url: https://api.groq.com/openai/v1
          temperature: 0.0
          reasoning_effort: low
          usd_per_mtok_in: 0.075
          usd_per_mtok_out: 0.30
      analyst: *open_small
      risk_assessor: *open_small
      fit_matcher: *open_small
      pricing: *open_small
      verifier: *open_small
      compliance: *open_small
      writer: &open_strong
        provider: groq
        model: openai/gpt-oss-120b
        base_url: https://api.groq.com/openai/v1
        temperature: 0.4
        usd_per_mtok_in: 0.15
        usd_per_mtok_out: 0.60
        # groq has a daily token cap; local has none
        fallback:
          provider: ollama
          model: qwen3:8b
          base_url: http://localhost:11434/v1
          temperature: 0.4
          reasoning_effort: none
      critic:
        <<: *open_strong
        temperature: 0.0
      client_liaison:
        <<: *open_strong
        temperature: 0.3

    paid:
      scout: *open_small
      analyst: *open_small
      risk_assessor: *open_small
      fit_matcher: *open_small
      pricing: *open_small
      verifier: *open_small
      compliance: *open_small
      writer: &paid_strong
        provider: openrouter
        model: openai/gpt-5-mini
        base_url: https://openrouter.ai/api/v1
        temperature: 0.4
      critic:
        <<: *paid_strong
        temperature: 0.0
      client_liaison:
        <<: *paid_strong
        temperature: 0.3

    # deployment: open-weight models on groq, no ollama
    open_hosted:
      scout: &hosted_small
        provider: groq
        model: openai/gpt-oss-20b
        base_url: https://api.groq.com/openai/v1
        temperature: 0.0
        reasoning_effort: low
        usd_per_mtok_in: 0.075
        usd_per_mtok_out: 0.30
        # groq's free tier caps each model at 200k tokens a day; openrouter's free pool is separate
        fallback: &hosted_free
          provider: openrouter
          model: nvidia/nemotron-3-ultra-550b-a55b:free
          base_url: https://openrouter.ai/api/v1
          temperature: 0.0
      analyst: *hosted_small
      risk_assessor: *hosted_small
      fit_matcher: *hosted_small
      pricing: *hosted_small
      verifier: *hosted_small
      compliance: *hosted_small
      writer: &hosted_strong
        provider: groq
        model: openai/gpt-oss-120b
        base_url: https://api.groq.com/openai/v1
        temperature: 0.4
        reasoning_effort: low
        usd_per_mtok_in: 0.15
        usd_per_mtok_out: 0.60
        # daily cap on the free tier
        fallback:
          <<: *hosted_free
          temperature: 0.4
      critic:
        <<: *hosted_strong
        temperature: 0.0
      client_liaison:
        <<: *hosted_strong
        temperature: 0.3

marketplace:
  mode: gigsim
  # gigsim has no stats endpoint, served from make data output
  market_stats_path: data/processed/pricing_stats.json
  gigsim_base_url_env: GIGSIM_BASE_URL
  gigsim_base_url_default: http://localhost:8081
  upwork_mcp_url: https://mcp.upwork.com/mcp
  timeout_s: 15
  max_retries: 3
  backoff_s: 0.5
  backoff_max_s: 8
  # below gigsim's 30 burst, 0.5/s
  rate_limits:
    gigsim:
      requests_per_minute: 20
      burst: 10
      poll_interval_minutes: 30
    upwork:
      requests_per_minute: 10
      burst: 3
      poll_interval_minutes: 180

# our MCP servers
mcp:
  audit_dir: data/audit
  workspace_dir: data/workspace
  # stdio runs as this user
  default_user: noor
  issuer_url: http://localhost:8100
  ports: {marketplace: 8101, workspace: 8102, portfolio: 8103}
  limits:
    search_limit_max: 50
    cover_letter_max_chars: 6000
    screening_answer_max_chars: 2000
    max_screening_answers: 10
    message_max_chars: 5000
    bid_max_usd: 100000
    idempotency_key_max_chars: 200
    free_slots_max_days: 14
    slot_min_minutes: 15
    slot_max_minutes: 240
    email_subject_max_chars: 200
    email_body_max_chars: 5000
  workspace:
    seed: 4016
    work_start_hour: 9
    work_end_hour: 17
    busy_blocks_per_day: 2
  # tokens: env wins, defaults are local dev only
  users:
    - user: noor
      tenant: ai_ml
      timezone: Asia/Karachi
      token_env: MCP_TOKEN_AI_ML
      token_default: dev-mcp-ai_ml
      gigsim_token_env: GIGSIM_TOKEN_AI_ML
      gigsim_token_default: dev-ai_ml-token
    - user: tobias
      tenant: fullstack
      timezone: Europe/Lisbon
      token_env: MCP_TOKEN_FULLSTACK
      token_default: dev-mcp-fullstack
      gigsim_token_env: GIGSIM_TOKEN_FULLSTACK
      gigsim_token_default: dev-fullstack-token
    - user: mina
      tenant: data_analyst
      timezone: America/Bogota
      token_env: MCP_TOKEN_DATA_ANALYST
      token_default: dev-mcp-data_analyst
      gigsim_token_env: GIGSIM_TOKEN_DATA_ANALYST
      gigsim_token_default: dev-data_analyst-token

budgets:
  max_graph_steps: 30
  max_revisions: 2
  # analysis about 2.5k plus up to 3 writer passes
  max_tokens_per_job: 30000
  # declared targets
  targets:
    p95_latency_s_per_job: 20
    p95_latency_s_per_proposal: 60
    cost_usd_per_job: 0.002
    cost_usd_per_proposal: 0.01

thresholds:
  minimum_fit_score: 0.60
  watch_fit_score: 0.45
  maximum_risk_score: 0.70

bidding_rules:
  currency: USD
  weekly_connects_budget: 80
  # v2 doubles big jobs
  max_connects_per_job: 32
  connects_unit_cost_usd: 0.15
  min_hourly_rate: 25
  min_fixed_price: 100
  platform_fee_pct: 10
  max_proposals_per_day: 10
  # fitted on 2023 jobs
  connects_rule:
    hourly_default: 12
    unknown_default: 8
    fixed_tiers:
      - {max_budget: 10, connects: 2}
      - {max_budget: 40, connects: 4}
      - {max_budget: 500, connects: 8}
      - {max_budget: 2000, connects: 12}
      - {max_budget: null, connects: 16}
  # new platform rules
  extra: {}

paths:
  policy_pack: data/policy_pack
  prompts_dir: agent/prompts
  personas_dir: data/personas
  processed_dir: data/processed
  raw_dir: data/raw/kaggle
  seed_dir: gigsim/seed

data:
  seed: 4016
  split_sizes:
    history: 1500
    stream: 400
    dev_pool: 600
  off_topic_share: 0.15
  stream_dup_cap: 3
  min_description_words: 20
  pricing_min_count: 30
  # outside caps -> null
  max_fixed_budget: 100000
  max_hourly_rate: 500
  contract_date_min: 2000-01-01
  contract_date_max: 2024-12-31

synth:
  proposals_per_persona: 150
  reviews_per_persona: 25
  label_noise: 0.15
  clients: 400
  scammer_share: 0.06
  scam_share: 0.08
  injection_share: 0.06
  holdout_size: 40
  dev_jobs_per_persona: 200
  relevant_evidence_k: 5
  # bid rule thresholds
  bid_min_skill_hits: 2
  bid_min_coverage: 0.3

# portfolio retrieval, open models on CPU
rag:
  variant: v2_filter
  default_k: 5
  # chunks pulled before grouping by evidence
  candidate_multiplier: 6
  embeddings:
    provider: sentence_transformers
    model: nomic-ai/nomic-embed-text-v1.5
    dim: 768
    batch_size: 32
    trust_remote_code: true
    query_prefix: "search_query: "
    document_prefix: "search_document: "
    # low-memory hosts
    fallback:
      provider: sentence_transformers
      model: BAAI/bge-small-en-v1.5
      dim: 384
      batch_size: 64
      query_prefix: "Represent this sentence for searching relevant passages: "
      document_prefix: ""
    ollama:
      provider: ollama
      model: nomic-embed-text
      dim: 768
      base_url: http://localhost:11434
      query_prefix: "search_query: "
      document_prefix: "search_document: "
    # deployment (512 MB, no torch): EMBEDDINGS_PROVIDER=lite. nomic via onnx needs 934 MB and its
    # quantized build only reaches cosine 0.965 with the torch vectors, so the deployment has its own index
    lite:
      provider: fastembed
      model: BAAI/bge-small-en-v1.5
      dim: 384
      batch_size: 32
      query_prefix: "Represent this sentence for searching relevant passages: "
      document_prefix: ""
    cache_path: data/cache/embeddings.sqlite
  chunking:
    strategy: fixed
    size_words: 200
    overlap_words: 40
  store:
    backend: pgvector
    dsn_env: DATABASE_URL
    dsn_default: postgresql://gigbid:gigbid@localhost:5432/gigbid
    schema: rag
  reranker:
    provider: huggingface
    model: BAAI/bge-reranker-v2-m3
  # ingested through the github mcp server; real repos get their own tenant
  github_repos:
    - {owner: muqarrab-k, repo: Automated-Invoice-Processing, persona: muqarrab}

# how agents reach MCP servers
mcp_client:
  # acts as this mcp user unless told otherwise
  user: noor
  timeout_s: 30
  max_retries: 2
  backoff_s: 0.5
  servers:
    marketplace:
      transport: streamable_http
      url_env: MCP_MARKETPLACE_URL
      url_default: http://localhost:8101/mcp
    portfolio:
      transport: streamable_http
      url_env: MCP_PORTFOLIO_URL
      url_default: http://localhost:8103/mcp
    workspace:
      transport: streamable_http
      url_env: MCP_WORKSPACE_URL
      url_default: http://localhost:8102/mcp
    # official github server, read-only
    github:
      transport: stdio
      command: docker
      args: [run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, -e, GITHUB_TOOLSETS, -e, GITHUB_READ_ONLY,
             "ghcr.io/github/github-mcp-server:v2.0.3"]
      env: {GITHUB_TOOLSETS: repos, GITHUB_READ_ONLY: "1"}
      token_env: GITHUB_TOKEN
      token_as: GITHUB_PERSONAL_ACCESS_TOKEN
      optional: true
  # args an agent cannot change
  forced_args:
    single_react:
      create_proposal_draft: {dry_run: true}
  # agent-facing default for search_evidence; proposals need an explicit filter
  defaults:
    search_evidence:
      types: [case_study, readme, code, review, cv]
  # tool names per agent
  allowlists:
    scout: &marketplace_read [search_jobs, get_job, get_client_history, get_connects_balance, list_proposals,
                              list_threads, list_messages, get_events, get_policy, get_market_stats]
    analyst: []
    risk_assessor: *marketplace_read
    fit_matcher: &portfolio_read [search_evidence, get_case_study, list_skills, get_evidence]
    pricing: *marketplace_read
    writer: *portfolio_read
    verifier: *portfolio_read
    critic: *portfolio_read
    compliance: []
    # writes only after approval, enforced by the graph
    client_liaison: [search_jobs, get_job, get_client_history, get_connects_balance, list_proposals,
                     list_threads, list_messages, get_events, get_policy, create_proposal_draft,
                     submit_proposal, send_message, free_slots, create_tentative_hold, create_email_draft]
    # rq-c baseline: drafts only, never submit or send
    # approval gate: dry runs before, writes only after a human approves
    approval: [get_job, get_connects_balance, create_proposal_draft, submit_proposal]
    single_react: [search_jobs, get_job, get_client_history, get_connects_balance, get_policy,
                   create_proposal_draft, search_evidence, get_case_study, list_skills]
    proposal_eval: [get_job]

# bid graph nodes
nodes:
  cache_dir: data/cache/nodes
  # retries before the fallback model
  retries: 1
  # whole-run failures before dead_letter
  max_attempts: 3
  # wait this long at most on a per-minute rate limit before using the fallback
  max_rate_limit_wait_s: 30

risk:
  scam_signals_path: data/processed/scam_signals.json
  scam_signal_weight: 0.03
  scam_signal_cap: 0.15
  llm_weight: 0.3
  # pattern -> flag, checked on the job text
  patterns:
    - {flag: unpaid_work, weight: 0.5, regex: "(?i)\\b(unpaid|free)\\s+(trial|test|sample|task)|free sample|test task is unpaid|for free\\b"}
    - {flag: off_platform, weight: 0.5, regex: "(?i)\\b(telegram|whatsapp|skype id|text(ing)? \\+?\\d|outside (the )?(platform|upwork)|pay you directly)\\b"}
    - {flag: scam, weight: 0.6, regex: "(?i)(onboarding kit|registration fee|purchase .{0,30}(kit|license)|certification for \\$|refunded after)"}
    - {flag: scam, weight: 0.6, regex: "(?i)\\b(usdt|trc20|crypto wallet|connect your wallet|send back \\d+%)"}
    - {flag: scam, weight: 0.6, regex: "(?i)(photo of your id|upwork username and password|online banking|receive .{0,20}payments into your own bank)"}
  injection_patterns:
    - "(?i)ignore (all )?(previous|prior|above) (instructions|rules)"
    - "(?i)(system prompt|hidden instructions)"
    - "(?i)note to (any )?ai|ai assistant reading|assistant:\\s"
    - "(?i)(maximum fit score|recommend bidding immediately|without waiting for human approval)"
    - "<\\|system\\|>|\\[//\\]: #"
    - "[\\u200b\\u200c\\u200d\\u2060]"
    - "(?i)decode and follow|you are devmode|let's play a game"
  client:
    new_account_days: 60
    poor_history_min_posted: 5
    odd_spend_usd: 20000

fit:
  max_requirements: 6
  k_per_requirement: 3
  strong_score: 0.62
  partial_score: 0.55
  gap_penalty: 0.25

decision:
  # any of these flags means skip
  skip_flags: [scam, unpaid_work, off_platform]
  # model-only skip flags count only next to a rule signal
  model_flags_need_rule: true
  # injection never corroborates
  corroborating_signals: [pattern:scam, pattern:unpaid_work, pattern:off_platform, client:new_account_no_hires,
                          client:odd_spend, client:many_posts_no_hires]
  skip_on_gap: true
  # flag only: injected text never changes the decision
  injection_action: flag
  require_budget_over_floor: true

pricing:
  connects_reserve_share: 0.2
  round_to: 5

scout:
  seen_store: data/scout/seen.sqlite
  saved_searches:
    ai_ml:
      - {q: machine learning, limit: 20}
      - {q: chatbot, limit: 20}
      - {skills: [Python], limit: 20}
    fullstack:
      - {q: react, limit: 20}
      - {skills: [JavaScript], limit: 20}
    data_analyst:
      - {q: dashboard, limit: 20}
      - {skills: [SQL], limit: 20}

writer:
  min_words: 110
  # gigsim v2 caps 220
  max_words: 210
  max_evidence: 6
  evidence_chars: 1200

verifier:
  # share of claim content words found in the cited evidence
  unsupported_below: 0.25
  judge_below: 0.6
  use_llm: true

critic:
  min_job_terms: 2
  generic_openers: [passionate, hard-working, hardworking, "dear sir", "dear hiring manager", "to whom it may concern",
                    "i am an expert", "i have read your job", "highly skilled", "i am the best"]

compliance:
  policy_rules_path: data/policy_pack/policy_rules.yaml
  # rules whose sentences may be cut instead of blocking; empty = every violation blocks
  clean_rules: []
  # rules that match on patterns only in proposals; empty mirrors GigSim, which blocks the bare keywords
  patterns_only_rules: []
  borderline_terms: [ensure, promise, risk-free, "100%", "will definitely", "fully satisfied"]
  # a draft must keep at least this many evidence-backed claims after verification to be sent
  min_grounded_claims: 1

# per user, never allows auto-send
autonomy:
  auto_skip_low_fit: true
  auto_send: false


# langgraph checkpoints; tests use memory
checkpointer:
  backend: postgres
  dsn_env: DATABASE_URL
  dsn_default: postgresql://gigbid:gigbid@localhost:5432/gigbid
  schema: langgraph
# long-term memory (langgraph store); tests use memory
memory:
  backend: postgres
  # style rules promoted from approval edits
  style:
    min_repeats: 3
    # share of the recent window that must agree
    min_share: 0.6
    window: 6
    shorter_ratio: 0.8
    watch_terms: [passionate, excited, thrilled, "hard-working", "highly skilled", expert, "dear sir",
                  "i hope this", "look forward", "rest assured", "kindly"]
  # what wins or gets replies, per job category
  outcome:
    min_submitted: 5
    min_reply_rate: 0.3

# web api
api:
  secret_env: APP_SECRET_KEY
  token_minutes: 720
  # local: gigsim and the mcp servers in-process; remote: the mcp servers over http
  mcp: local
  # preloaded account for the reviewer; dev default like the mcp tokens
  reviewer: {username: reviewer, persona: ai_ml, password_env: REVIEWER_PASSWORD, password_default: reviewer-dev}
  scheduler:
    enabled: false
    interval_minutes: 30
    analyse_new: true

# ci smoke eval gates (make eval)
eval:
  smoke_jobs: 30
  # baseline 0.2333, smoke_eval.json
  min_recall_at_5: 0.20
  # baseline 0.8182
  min_bid_f1: 0.75
  # committed proposal eval
  max_unsupported_per_proposal: 0.5
